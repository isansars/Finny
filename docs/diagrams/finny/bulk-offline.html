.fy-center { max-width: 380px; margin: 14vh auto 0; padding: 16px; text-align: center; }

/* the logo (chosen 23 Nov 2026: the F monogram, Nunito logotype) */

.fy-lockup svg { filter: drop-shadow(0 3px 8px color-mix(in srgb, var(--primary) 25%, transparent)); border-radius: 22.5%; }

/* ---- UI/UX audit fixes (FINNY-55, 23 Nov 2026) */
/* 1. secondary text meets WCAG AA (≥ 4.5:1) on white and on the soft fills */
:root { --text-3: #6f5f82; --transfer: #6f5f82; }
@media (prefers-color-scheme: dark) { :root { --text-3: #b3a6c2; --transfer: #b3a6c2; } }
.fy-search input::placeholder, .fy-input::placeholder, .fy-what input::placeholder { color: var(--text-3); opacity: 1; }
/* 6. a solid tab bar */
.fy-tabbar { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: 0 -4px 16px rgba(76, 29, 89, .06); }
/* 8. thumb-sized targets */
.fy-btn.small { min-height: 44px; } .fy-month button { width: 44px; height: 44px; }
.fy-chip { min-height: 40px; } .fy-seg button { min-height: 40px; }
.fy-row.tap, button.fy-row { min-height: 56px; }
/* 5. account chips wrap */
.fy-chips.wrap { flex-wrap: wrap; overflow: visible; }
/* 3. placeholders while loading */
.fy-skel { display: inline-block; height: .9em; width: 6em; border-radius: 8px; background: linear-gradient(90deg, var(--surface-3), var(--surface-2), var(--surface-3)); background-size: 200% 100%; animation: fy-shimmer 1.2s ease-in-out infinite; vertical-align: middle; }
@keyframes fy-shimmer { to { background-position: -200% 0; } }
/* 4. the legend shows whole names and amounts */
.fy-legend .r { align-items: flex-start; } .fy-legend .r i { margin-top: 4px; }
.fy-legend .r span { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; }
.fy-legend .r small { display: block; color: var(--text-3); font-weight: 600; font-size: 12px; }
/* 10. saved / invested on one quiet line */
.fy-hero .extra { margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--text-2); display: flex; gap: 14px; flex-wrap: wrap; }
.fy-hero .extra b { color: var(--text); font-variant-numeric: tabular-nums; }
/* 2. the whole chart is the tap area */
.fy-bars { touch-action: pan-y; cursor: pointer; position: relative; }
.fy-bars > span { pointer-events: none; } .fy-bars > span i.z { visibility: hidden; }
.fy-bars-pick { font-size: 13px; font-weight: 700; color: var(--text-2); margin: -2px 0 8px; min-height: 18px; }
/* 7. "Rp" and the amount together */
.fy-amount { gap: 4px; } .fy-amount input { width: auto; min-width: 1.2ch; max-width: 100%; text-align: left; }
/* 12. two-line amount on card rows */
.fy-owed { text-align: right; } .fy-owed small { display: block; font-size: 12px; font-weight: 700; color: var(--text-3); }
/* 14. a date field that reads "23 Nov 2026" */
.fy-datefield { position: relative; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.fy-datefield input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
/* FINNY-73: bank statements */
.fy-back { display: inline-flex; align-items: center; gap: 2px; margin: 4px 0 4px -6px; padding: 4px 6px; border: 0; background: none; color: var(--primary-text); font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer; }
.fy-drop { text-align: center; display: flex; flex-direction: column; align-items: center; border: 2px dashed color-mix(in srgb, var(--primary) 35%, transparent); }
.fy-iconnote { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; }
.fy-iconnote svg { flex: none; margin-top: 1px; }
.fy-faded .fy-tile { opacity: .55; } /* a line already in Finny: quieter, its words still readable (FINNY-157) */
.fy-faded .main .t, .fy-faded .fy-amt { color: var(--text-2); }
.fy-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: none; color: var(--text-3); cursor: pointer; border-radius: 10px; }
.fy-gap { background: var(--lemon-s); color: var(--lemon-i); margin-bottom: 4px; }
.fy-gap .h { display: flex; gap: 8px; align-items: center; font-weight: 800; }
.fy-gap .b { font-size: 13.5px; font-weight: 600; margin-top: 4px; line-height: 1.45; }
.fy-savebar { position: sticky; bottom: calc(90px + env(safe-area-inset-bottom)); margin-top: 16px; padding: 22px 0 6px; z-index: 5; background: linear-gradient(color-mix(in srgb, var(--bg) 0%, transparent), var(--bg) 20px); }
@media (min-width: 760px) { .fy-savebar { bottom: 12px; } }
.fy-ok { display: flex; gap: 8px; align-items: center; }
/* FINNY-63: budget */
.fy-bbar { height: 8px; border-radius: 99px; background: var(--surface-3); margin: 6px 0 4px; overflow: hidden; }
.fy-bbar i { display: block; height: 100%; border-radius: 99px; }
.fy-bline { display: flex; justify-content: space-between; gap: 8px; }
.fy-bline > span:first-child { overflow: hidden; text-overflow: ellipsis; }
.fy-bline .num { font-size: 14px; flex: none; font-variant-numeric: tabular-nums; }
.fy-bline .of { color: var(--text-3); font-weight: 600; }
.fy-linkish { border: 0; background: none; font: inherit; color: inherit; cursor: pointer; text-align: left; }
/* FINNY-162: only a bare text link loses its padding; a row, card or button that's also a link keeps its own (Recurring, Sign out, the match check). */
.fy-linkish:not(.fy-row):not(.fy-card):not(.fy-btn) { padding: 0; }
.fy-linkish b { text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--primary) 45%, transparent); text-underline-offset: 3px; }
/* FINNY-80/81: reports */
.fy-report { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .fy-report { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.fy-key { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--text-2); }
.fy-key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-left: 4px; }
.fy-stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.fy-trow { min-height: 48px; gap: 10px; }
.fy-trow .car { width: 22px; height: 22px; flex: none; display: grid; place-items: center; color: var(--text-3); border: 0; background: none; padding: 0; cursor: pointer; }
.fy-trow .main .t { white-space: normal; line-height: 1.25; }
.fy-trow .fy-amt { font-size: 14px; min-width: 84px; text-align: right; }
.fy-trow .avg { min-width: 52px; text-align: right; font-size: 13px; font-weight: 700; color: var(--text-3); font-variant-numeric: tabular-nums; }
.fy-3col { display: grid; grid-template-columns: 66px 66px 66px; gap: 4px; text-align: right; font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
/* FINNY-88: debts */
.fy-billnote { margin-top: 12px; display: flex; gap: 10px; align-items: flex-start; background: var(--peach-s); color: var(--peach-i); }
.fy-billnote svg { flex: none; margin-top: 2px; }
.fy-billnote .h { font-weight: 800; }
.fy-billnote .b { font-size: 13px; font-weight: 600; margin-top: 2px; }
/* FINNY-96: assets */
.fy-alloc { display: flex; height: 12px; border-radius: 99px; overflow: hidden; margin: 6px 0 8px; background: var(--surface-3); }
.fy-alloc i { display: block; height: 100%; }
.fy-key span { display: inline-flex; align-items: center; gap: 4px; }
/* Sprint 9: the emergency fund's target options and the source ticks */
.fy-opt { display: block; width: 100%; text-align: left; border: 2px solid var(--border); background: var(--surface); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; cursor: pointer; color: var(--text); font: inherit; }
.fy-opt b { display: block; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.fy-opt span { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.fy-opt.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 8%, var(--surface)); }
.fy-check { width: 26px; height: 26px; flex: none; border-radius: 8px; border: 2px solid var(--border-2, var(--border)); background: var(--surface); display: inline-grid; place-items: center; cursor: pointer; color: var(--primary-ink); padding: 0; }
.fy-check.on { background: var(--primary); border-color: var(--primary); }
/* Sprint 10: the month-end review */
.fy-rv-step { padding: 12px 14px; margin-bottom: 10px; }
.fy-rv-tick { width: 24px; height: 24px; border-radius: 99px; display: inline-grid; place-items: center; flex: none; border: 2px solid var(--border-strong); color: #fff; }
.fy-rv-tick.on { background: var(--income); border-color: var(--income); }
.fy-rv-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
.fy-rv-line > span:first-child { min-width: 0; }
.fy-rv-line small { display: block; font-size: 12px; color: var(--text-3); font-weight: 600; }
.fy-rv-line .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fy-rv-nudge { display: flex; gap: 10px; align-items: center; padding: 14px 16px; margin-bottom: 12px; border: 2px solid var(--primary-2); background: var(--primary-soft); color: var(--text); text-decoration: none; }
.fy-rv-warn { display: flex; gap: 8px; align-items: center; background: var(--rose-s); color: var(--rose-i); border-radius: 12px; padding: 8px 10px; font-weight: 700; font-size: 13px; margin-bottom: 10px; }
/* Sprint 11: goals */
.fy-goal { display: block; padding: 12px 14px; margin-bottom: 10px; color: var(--text); text-decoration: none; }
.fy-goal-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--text-2); }
.fy-goal-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; font-weight: 700; color: var(--text-2); margin-top: 4px; }
.fy-goal-legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
.fy-goal-legend i.dash { height: 0; border-top: 2.5px dashed; background: none; }
.fy-goal-legend i.dot { height: 0; border-top: 2.5px dotted; background: none; }
.fy-rv-goals { padding: 8px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
.fy-rv-goals > b { display: block; margin-bottom: 4px; }
.fy-rv-goals a { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; color: var(--text); text-decoration: none; }
/* Sprint 12: the workbook match check */
.fy-mt-mark { width: 22px; height: 22px; border-radius: 99px; display: inline-grid; place-items: center; flex: none; color: #fff; }
.fy-mt-mark.ok { background: var(--income); } .fy-mt-mark.no { background: var(--spend); }
.fy-mt-acc + .fy-mt-acc { border-top: 1px solid var(--sep); }
.fy-rv-done { margin-top: 10px; background: var(--mint-s); color: var(--mint-i); border-radius: 12px; padding: 8px 10px; font-weight: 800; font-size: 13px; }
/* Sprint 13 (FINNY-134): every small text link and button gets a 44 x 44 px tap area without changing its look;
   amber warning text has its own token with AA contrast in both themes. */
:root { --warn-text: #92400e; }
@media (prefers-color-scheme: dark) { :root { --warn-text: #fcd34d; } }
/* z-index: the tap area sits above a card that follows (a section title's Edit above its list). */
.fy-more, .fy-linkish:not(.fy-row):not(.fy-card):not(.fy-btn), .fy-rv-line a, .fy-tap { position: relative; z-index: 1; }
.fy-more::after, .fy-linkish:not(.fy-row):not(.fy-card):not(.fy-btn)::after, .fy-rv-line a::after, .fy-tap::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: max(100%, 44px); height: max(100%, 44px); transform: translate(-50%, -50%);
}
/* FINNY-135: single-column pages stay readable on a wide screen. */
.fy-narrow { max-width: 720px; margin: 0 auto; }
/* Sprint 14: recurring transactions */
.fy-rc-due { padding: 12px 0 4px; margin-bottom: 12px; border: 2px solid var(--primary-2); }
.fy-rc-head { display: flex; justify-content: space-between; align-items: center; padding: 0 16px 6px; }
.fy-rc-head b { display: flex; gap: 6px; align-items: center; }
.fy-rc-acts { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }
.fy-rc-acts .fy-chip { min-height: 36px; padding: 0 12px; }
.fy-rc-spot { margin-top: 16px; border: 2px dashed var(--primary-2); }
.fy-switch[data-on="true"] { background: linear-gradient(135deg, var(--primary-2), var(--primary)); } .fy-switch[data-on="true"] i { left: 21px; }
/* Sprint 15: offline */
.fy-offline, .fy-online { display: flex; gap: 8px; align-items: center; border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: 13px; margin-bottom: 10px; }
.fy-offline { background: var(--lemon-s); color: var(--warn-text); }
.fy-online { background: var(--mint-s); color: var(--mint-i); }
.fy-waiting { display: flex; gap: 4px; align-items: center; justify-content: flex-end; color: var(--warn-text); font-size: 12px; font-weight: 800; }
.fy-offline-note { background: var(--lemon-s); color: var(--warn-text); border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 13px; margin: 12px 0 0; }

/* FINNY-163: the first Tab stop on every page, shown only when it has focus. */
.fy-skip { position: fixed; left: 12px; top: -60px; z-index: 100; background: var(--surface); color: var(--primary-text); font-weight: 800; padding: 10px 16px; border-radius: 12px; box-shadow: var(--shadow-lg); }
.fy-skip:focus { top: 12px; outline: 2px solid var(--primary); outline-offset: 2px; }
main.fy-wrap:focus { outline: none; }
/* FINNY-164: Home's add form on a laptop: Save stays at the bottom of the panel while the form scrolls inside it. */
@media (min-width: 900px) { .fy-home .side .fy-sheet-foot { position: sticky; bottom: -16px; z-index: 2; background: var(--surface); margin: 14px -16px -16px; padding: 12px 16px 16px; border-top: 1px solid var(--border); } }
/* FINNY-165: rows you can click react to the mouse (only where there is one). */
@media (hover: hover) { a.fy-row:hover, button.fy-row:hover:not(:disabled), .fy-row.tap:hover { background: color-mix(in srgb, var(--primary) 6%, transparent); cursor: pointer; } }

/* FINNY-165: the add form beside Home is narrower than a phone: four categories a row so long names fit. */
@media (min-width: 900px) { .fy-home .side .fy-catgrid { grid-template-columns: repeat(4, 1fr); } }
/* FINNY-172/173: every transaction, to check. */
.fy-tx-filters { display: flex; flex-wrap: wrap; gap: 8px; }
.fy-tx-filters .fy-search { flex: 1 1 100%; }
.fy-tx-filters select.fy-input { flex: 1 1 40%; min-width: 0; min-height: 40px; font-weight: 700; color: var(--text-2); text-overflow: ellipsis; }
@media (min-width: 760px) { .fy-tx-filters .fy-search { flex: 1 1 260px; } .fy-tx-filters select.fy-input { flex: 0 1 auto; width: auto; max-width: 210px; } }
.fy-tx-wrap { overflow-x: auto; }
.fy-tx { width: 100%; border-collapse: collapse; font-size: 14px; }
.fy-tx th { text-align: left; font-size: 12.5px; color: var(--text-2); font-weight: 800; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.fy-tx td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.fy-tx tbody tr:last-child td { border-bottom: 0; }
.fy-tx td.dt { white-space: nowrap; color: var(--text-2); font-weight: 700; }
.fy-tx td.ds .t { font-weight: 700; } .fy-tx td.ds .s { color: var(--text-3); font-size: 12.5px; }
.fy-tx td.src { color: var(--text-2); font-size: 12.5px; font-weight: 700; }
.fy-tx .am { text-align: right; white-space: nowrap; } .fy-tx th.pick, .fy-tx td.pick { width: 36px; padding-right: 0; }
.fy-tx td.act { white-space: nowrap; text-align: right; width: 80px; }
.fy-tx tr.flag td { background: color-mix(in srgb, #f59e0b 8%, transparent); }
.fy-tx tr.on td { background: color-mix(in srgb, var(--primary) 9%, transparent); }
@media (hover: hover) { .fy-tx tbody tr:hover td { background: color-mix(in srgb, var(--primary) 5%, transparent); } }
.fy-sort { border: 0; background: none; font: inherit; color: inherit; cursor: pointer; padding: 0; display: inline-flex; align-items: center; gap: 4px; }
.fy-tick { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; margin: 0; vertical-align: middle; }
.fy-icon-btn { border: 0; background: none; color: var(--text-2); width: 32px; height: 32px; border-radius: 9px; display: inline-grid; place-items: center; cursor: pointer; }
.fy-icon-btn:hover { background: var(--surface-3); color: var(--text); }
.fy-flag { background: var(--lemon-s); color: var(--lemon-i); font-size: 11.5px; padding: 2px 8px; display: inline-flex; gap: 4px; align-items: center; vertical-align: 1px; white-space: nowrap; }
.fy-tx-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--border); font-weight: 700; color: var(--text-2); font-size: 13.5px; }
.fy-tx-foot.phone { border: 0; padding: 10px 4px 0; }
.fy-tx-row.flag { background: color-mix(in srgb, #f59e0b 8%, transparent); } .fy-tx-row.on { background: color-mix(in srgb, var(--primary) 9%, transparent); }
.fy-tx-row .main .t { white-space: normal; }
/* FINNY-187: the undo bar after a delete (above the tab bar on a phone), and the "Bring back" chip. */
.fy-undo { position: fixed; left: 0; right: 0; bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 45; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; }
.fy-undo-in { width: 100%; max-width: 520px; pointer-events: auto; animation: fy-up .2s ease; }
.fy-undo .bar { display: flex; gap: 10px; align-items: center; background: var(--text); color: var(--bg); border-radius: 18px; padding: 8px 8px 8px 16px; box-shadow: var(--shadow-lg); }
.fy-undo .bar b { flex: 1; min-width: 0; font-weight: 800; } .fy-undo .bar .amt { white-space: nowrap; }
.fy-undo .bar .x { border: 0; background: none; color: inherit; opacity: .75; width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; border-radius: 12px; }
.fy-undo .bar.done { background: var(--mint-s); color: var(--mint-i); padding: 14px 16px; font-weight: 800; }
.fy-undo .line { height: 3px; border-radius: 3px; background: color-mix(in srgb, var(--text) 20%, transparent); margin: 6px 18px 0; overflow: hidden; }
.fy-undo .line i { display: block; height: 100%; background: var(--primary); animation: fy-undo-run 30s linear forwards; }
@keyframes fy-undo-run { from { width: 100%; } to { width: 0; } }
@media (prefers-reduced-motion: reduce) { .fy-undo .line i { animation: none; width: 100%; } }
@media (min-width: 760px) { .fy-undo { bottom: 24px; } }
.fy-undo-later { margin: 0 0 12px; display: inline-flex; gap: 6px; align-items: center; }
.fy-bulk { position: sticky; bottom: calc(106px + env(safe-area-inset-bottom)); z-index: 30; margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--text); color: var(--bg); border-radius: 18px; padding: 10px 10px 10px 16px; box-shadow: var(--shadow-lg); }
.fy-bulk b { flex: 1 1 140px; }
.fy-bulk .fy-btn.ghost { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--bg) 35%, transparent); }
.fy-bulk .fy-icon-btn { color: inherit; } .fy-bulk .fy-icon-btn:hover { background: color-mix(in srgb, var(--bg) 15%, transparent); color: inherit; }
.fy-btn.danger-solid { background: #e11d48; color: #fff; border-color: #e11d48; }
@media (min-width: 760px) { .fy-bulk { bottom: 16px; } }
/* FINNY-172: seven places in the bar: on a small laptop only the current one keeps its label (each keeps its name and a tooltip). */
@media (min-width: 760px) and (max-width: 1199px) { .fy-topbar a.nav { padding: 8px 10px; } .fy-topbar a.nav:not(.on) .lbl { display: none; } .fy-topbar .brand { margin-right: 8px; } }
/* FINNY-178: on a phone. Fields are 16 px (an iPhone zooms the page into anything smaller). A sheet fits the visible screen
   (above the on-screen keyboard): its title row stays at the top, its buttons at the bottom, the form scrolls between. */
@media (max-width: 759px) {
  .fy-input, input.fy-input, select.fy-input, textarea.fy-input, .fy-search input { font-size: 16px; }
  .fy-sheet-bg { top: var(--vvt, 0px); bottom: auto; height: var(--vvh, 100%); }
  .fy-sheet { max-height: calc(var(--vvh, 100dvh) - 16px - env(safe-area-inset-top)); padding-bottom: 0; }
  .fy-sheet > .fy-sheet-h { position: sticky; top: -8px; z-index: 3; background: var(--surface); margin: 0 -16px 12px; padding: 4px 16px 0; }
  .fy-sheet .fy-sheet-foot { position: sticky; bottom: 0; z-index: 3; background: var(--surface); margin: 14px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
  .fy-sheet > :last-child:not(.fy-sheet-foot):not(form), .fy-sheet > form:last-child > :last-child:not(.fy-sheet-foot) { margin-bottom: calc(16px + env(safe-area-inset-bottom)); }
}

/* FINNY-179: a chip row that scrolls sideways fades at its right edge, so a hidden chip is hinted at. */
.fy-chips:not(.wrap) { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); padding-right: 24px; }

/* FINNY-180: thumb-sized on a phone. Back links, chips (Due today, Recurring's suggestions), the Reports tree's rows and fold
   arrows reach 44 × 44 without changing how they look. */
.fy-back { min-height: 44px; }
.fy-chip { position: relative; } .fy-chip::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: max(100%, 44px); transform: translateY(-50%); }
.fy-trow a.t::after { content: ""; position: absolute; inset: 0; }
.fy-trow .car { position: relative; z-index: 2; width: 44px; height: 44px; margin: -11px; }

/* FINNY-178/180 (found by the phone suite): quick add's "What for" and its hidden date input are 16 px too; segmented
   controls and the review's goal lines are 44 px tall on a phone. */
@media (max-width: 759px) {
  .fy-what input, .fy-datefield input { font-size: 16px; }
  .fy-seg button { min-height: 44px; }
}
.fy-rv-goals a { min-height: 44px; align-items: center; padding: 0; }
